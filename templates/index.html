<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant - Sipariş</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Restoran</a>
      <div class="ms-auto">
        <a class="btn btn-sm btn-light" href="/admin">Admin</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-3">Menü</h3>
            {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form id="orderForm" method="post">
              <div class="mb-3">
                <label class="form-label">Masa numarası</label>
                <input name="masa" class="form-control" placeholder="Örn: 5" required>
              </div>

              <div class="list-group mb-3">
                {% for name, price in menu.items() %}
                <label class="list-group-item d-flex justify-content-between align-items-center">
                  <div>
                      <div class="fw-bold">{{ name|title }}</div>
                    <small class="text-muted">{{ price }} TL</small>
                  </div>
                  <div class="d-flex align-items-center">
                    <input type="number" class="form-control form-control-sm me-2 qty" data-name="{{ name }}" value="1" min="1" style="width:70px">
                    <input type="checkbox" class="form-check-input chk" data-name="{{ name }}">
                  </div>
                </label>
                {% endfor %}
              </div>

              <div id="hiddenInputs"></div>
              <div class="d-grid">
                <button class="btn btn-primary btn-lg">Siparişi Gönder</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('orderForm').addEventListener('submit', function(e){
      const container = document.getElementById('hiddenInputs');
      container.innerHTML = '';
      const checks = document.querySelectorAll('.chk');
      checks.forEach(function(chk){
        if(chk.checked){
          const name = chk.getAttribute('data-name');
          const qty = document.querySelector('.qty[data-name="'+name+'"]').value || 1;
          const inpU = document.createElement('input'); inpU.type='hidden'; inpU.name='urun'; inpU.value=name;
          const inpA = document.createElement('input'); inpA.type='hidden'; inpA.name='adet'; inpA.value=qty;
          container.appendChild(inpU); container.appendChild(inpA);
        }
      });
    });
  </script>
</body>
</html>
