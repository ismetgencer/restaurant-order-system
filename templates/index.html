{% extends 'base.html' %}

{% block title %}Restaurant - Sipariş{% endblock %}

{% block content %}
  <div class="container pb-5">
    <h1 class="h3 mb-3">Menü</h1>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form id="orderForm" method="post">
      <div class="mb-4 masa-field">
        <label class="form-label">Masa numarası</label>
        <input name="masa" class="form-control" placeholder="Örn: 5" required>
      </div>

      <div class="row g-3 mb-4">
        {% for name, price in menu.items() %}
        <div class="col-6 col-lg-4">
          <label class="menu-card list-group-item" data-price="{{ price }}">
            <img class="menu-card-img" src="{{ url_for('static', filename='menu/' + menu_images[name]) }}" alt="{{ name }}">
            <div class="menu-card-body">
              <div class="fw-bold">{{ name|title }}</div>
              <small class="text-muted">{{ price }} TL</small>
              <div class="d-flex align-items-center mt-2">
                <input type="number" class="form-control form-control-sm me-2 qty" data-name="{{ name }}" value="1" min="1">
                <input type="checkbox" class="form-check-input chk" data-name="{{ name }}">
              </div>
            </div>
          </label>
        </div>
        {% endfor %}
      </div>

      <div id="hiddenInputs"></div>
      <div class="d-flex justify-content-between align-items-center gap-3">
        <span class="fs-5 mb-0">Toplam: <strong id="liveTotal">0 TL</strong></span>
        <button class="btn btn-primary btn-lg">Siparişi Gönder</button>
      </div>
    </form>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    function updateTotal(){
      let total = 0;
      document.querySelectorAll('.chk').forEach(function(chk){
        if(!chk.checked) return;
        const name = chk.getAttribute('data-name');
        const price = Number(chk.closest('.list-group-item').getAttribute('data-price'));
        const qty = Number(document.querySelector('.qty[data-name="'+name+'"]').value) || 0;
        total += price * qty;
      });
      document.getElementById('liveTotal').textContent = total + ' TL';
    }

    document.querySelectorAll('.chk, .qty').forEach(function(el){
      el.addEventListener('input', updateTotal);
      el.addEventListener('change', updateTotal);
    });

    document.getElementById('orderForm').addEventListener('submit', function(e){
      const container = document.getElementById('hiddenInputs');
      container.innerHTML = '';
      const checks = document.querySelectorAll('.chk');
      checks.forEach(function(chk){
        if(chk.checked){
          const name = chk.getAttribute('data-name');
          const qty = document.querySelector('.qty[data-name="'+name+'"]').value || 1;
          const inpU = document.createElement('input'); inpU.type='hidden'; inpU.name='urun'; inpU.value=name;
          const inpA = document.createElement('input'); inpA.type='hidden'; inpA.name='adet'; inpA.value=qty;
          container.appendChild(inpU); container.appendChild(inpA);
        }
      });
    });
  </script>
{% endblock %}
